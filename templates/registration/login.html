{% extends "base.html" %}

{% block title %}Iniciar sesión — Obrify{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-sm mt-5">
      <div class="card-body p-4">
        <h1 class="h4 fw-bold text-primary text-center mb-4">Obrify</h1>
        <p class="text-muted text-center small mb-4">Gestión de obras de reforma</p>

        {% if form.errors %}
          <div class="alert alert-danger small">Email o contraseña incorrectos.</div>
        {% endif %}

        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label" for="id_username">Email</label>
            <input type="email" name="username" id="id_username" class="form-control" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label" for="id_password">Contraseña</label>
            <input type="password" name="password" id="id_password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Entrar</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
