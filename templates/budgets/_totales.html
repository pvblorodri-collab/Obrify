{# Bloque de totales del presupuesto. #}
<div id="totales" class="card border-0 shadow-sm bg-body">
  <div class="card-body">
    <div class="row justify-content-end">
      <div class="col-md-4">
        <div class="d-flex justify-content-between mb-1">
          <span class="text-muted">Base imponible</span>
          <span>{{ presupuesto.base_imponible|floatformat:2 }} €</span>
        </div>
        <div class="d-flex justify-content-between mb-1">
          <span class="text-muted">IVA ({{ presupuesto.iva_porcentaje|floatformat:0 }}%)</span>
          <span>{{ presupuesto.iva|floatformat:2 }} €</span>
        </div>
        <hr class="my-2">
        <div class="d-flex justify-content-between">
          <span class="fw-bold">TOTAL</span>
          <span class="h4 mb-0 text-primary">{{ presupuesto.total|floatformat:2 }} €</span>
        </div>
      </div>
    </div>
  </div>
</div>
