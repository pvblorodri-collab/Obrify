{# Dropdown de sugerencias del catálogo. #}
{% if resultados %}
<div class="list-group position-absolute w-100 shadow-sm" style="z-index: 20;">
  {% for cat in resultados %}
    <button type="button"
            class="list-group-item list-group-item-action py-2"
            hx-post="{% url 'aplicar_sugerencia' partida_id cat.pk %}"
            hx-target="#partida-{{ partida_id }}"
            hx-swap="outerHTML"
            hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
      <div class="d-flex justify-content-between align-items-start">
        <div class="small">{{ cat.descripcion|truncatechars:80 }}</div>
        <span class="badge bg-light text-dark ms-2 flex-shrink-0">
          {{ cat.precio_unitario|floatformat:2 }} €/{{ cat.unidad }}
        </span>
      </div>
    </button>
  {% endfor %}
</div>
{% endif %}
