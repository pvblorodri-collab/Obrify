{# Fila de una partida en modo edición. Se auto-guarda al cambiar cualquier campo. #}
<tr id="partida-{{ partida.pk }}"
    hx-post="{% url 'guardar_partida' partida.pk %}"
    hx-trigger="change from:find input, change from:find select"
    hx-target="this"
    hx-swap="outerHTML"
    hx-include="closest tr"
    hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  <td>
    <div class="position-relative">
      <input type="text"
             name="descripcion"
             class="form-control form-control-sm"
             value="{{ partida.descripcion }}"
             placeholder="Ej. Alicatado baño 20x20"
             hx-get="{% url 'autocompletar_partida' %}"
             hx-trigger="keyup changed delay:250ms, focus"
             hx-target="#sugerencias-{{ partida.pk }}"
             hx-vals='{"partida_id": "{{ partida.pk }}"}'
             hx-swap="innerHTML">
      <div id="sugerencias-{{ partida.pk }}" class="autocompletar-dropdown"></div>
    </div>
  </td>
  <td>
    <input type="number" step="0.01" name="cantidad" class="form-control form-control-sm text-end"
           value="{{ partida.cantidad|stringformat:'g' }}">
  </td>
  <td>
    <select name="unidad" class="form-select form-select-sm">
      {% for valor, etiqueta in partida.UNIDADES|default_if_none:"" %}{% endfor %}
      <option value="ud" {% if partida.unidad == 'ud' %}selected{% endif %}>ud</option>
      <option value="m" {% if partida.unidad == 'm' %}selected{% endif %}>m</option>
      <option value="m²" {% if partida.unidad == 'm²' %}selected{% endif %}>m²</option>
      <option value="m³" {% if partida.unidad == 'm³' %}selected{% endif %}>m³</option>
      <option value="kg" {% if partida.unidad == 'kg' %}selected{% endif %}>kg</option>
      <option value="h" {% if partida.unidad == 'h' %}selected{% endif %}>h</option>
      <option value="día" {% if partida.unidad == 'día' %}selected{% endif %}>día</option>
      <option value="pa" {% if partida.unidad == 'pa' %}selected{% endif %}>PA</option>
    </select>
  </td>
  <td>
    <div class="input-group input-group-sm">
      <input type="number" step="0.01" name="precio_unitario" class="form-control text-end"
             value="{{ partida.precio_unitario|stringformat:'g' }}">
      <span class="input-group-text">€</span>
    </div>
  </td>
  <td class="text-end fw-semibold">
    {{ partida.total|floatformat:2 }} €
  </td>
  <td class="text-end">
    <button type="button" class="btn btn-sm btn-link text-danger"
            hx-post="{% url 'eliminar_partida' partida.pk %}"
            hx-target="#partida-{{ partida.pk }}"
            hx-swap="outerHTML"
            hx-confirm="¿Eliminar esta partida?"
            hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
            title="Eliminar">
      <i class="bi bi-x-lg"></i>
    </button>
  </td>
</tr>
